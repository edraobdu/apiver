[project]
name = "apiver"
version = "0.1.0.dev0"
description = "Define API versions as deltas, not duplicates."
requires-python = ">=3.12"
dependencies = [
    "django~=5.2",
    "djangorestframework~=3.18",
    "drf-spectacular~=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reference", ".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["apiver"]

[tool.ruff.lint.per-file-ignores]
# Accessing a property for its side effect under pytest.raises() is the
# idiomatic way to exercise a lazy-computed property that raises — not a
# genuinely useless expression.
"tests/*" = ["B018"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apiver"]
