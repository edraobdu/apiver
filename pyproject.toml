[project]
name = "apiver"
version = "0.1.0.dev0"
description = "Define API versions as deltas, not duplicates."
requires-python = ">=3.12"
dependencies = [
    "django~=5.2",
    "djangorestframework~=3.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apiver"]
